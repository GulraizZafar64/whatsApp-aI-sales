<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Complete Button</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f3f4f6;
        }

        .btn {
            position: relative;
            width: 200px;
            height: 56px;
            border-radius: 28px;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.3px;
            overflow: hidden;
            transition: transform 0.12s, box-shadow 0.12s;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 10px 28px rgba(99, 102, 241, 0.55);
        }

        .btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn:disabled {
            cursor: default;
        }

        .btn-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
            pointer-events: none;
            gap: 7px;
        }

        .btn-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #fff;
            opacity: 0.8;
        }

        .anim-layer {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
        }

        .anim-layer.go {
            opacity: 1;
        }

        .ring {
            position: absolute;
            width: 40px;
            height: 40px;
        }

        .ring-track {
            fill: none;
            stroke: rgba(255, 255, 255, 0.2);
            stroke-width: 3;
        }

        .ring-spin {
            fill: none;
            stroke: #fff;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 30 96;
            stroke-dashoffset: 0;
            transform-origin: 20px 20px;
        }

        .ring-full {
            fill: none;
            stroke: #fff;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 126;
            stroke-dashoffset: 126;
            transform-origin: 20px 20px;
            transform: rotate(-90deg);
        }

        .tick-path {
            fill: none;
            stroke: #fff;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 28;
            stroke-dashoffset: 28;
        }

        .done-label {
            position: absolute;
            right: 14px;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            opacity: 0;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes drawCircle {
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes drawTick {
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <button class="btn" id="btn" onclick="run()">
        <div class="btn-text" id="btnText">
            <div class="btn-dot"></div>
            Complete
        </div>

        <div class="anim-layer" id="animLayer">
            <svg class="ring" id="ringEl" viewBox="0 0 40 40">
                <circle class="ring-track" cx="20" cy="20" r="17" />
                <circle class="ring-spin" cx="20" cy="20" r="17" id="spinArc" />
                <circle class="ring-full" cx="20" cy="20" r="17" id="fullCirc" />
                <polyline class="tick-path" points="11,20 17,26 29,14" id="tickPath" />
            </svg>
            <div class="done-label" id="doneLabel">Completed</div>
        </div>
    </button>

    <script>
        let busy = false;

        function run() {
            if (busy) return;
            busy = true;

            const btn = document.getElementById('btn');
            const btnText = document.getElementById('btnText');
            const animLayer = document.getElementById('animLayer');
            const spinArc = document.getElementById('spinArc');
            const fullCirc = document.getElementById('fullCirc');
            const tickPath = document.getElementById('tickPath');
            const doneLabel = document.getElementById('doneLabel');
            const ringEl = document.getElementById('ringEl');

            btn.disabled = true;

            // Step 1 — hide button text, show animation layer
            btnText.style.opacity = '0';
            setTimeout(() => {
                btnText.style.display = 'none';
                animLayer.classList.add('go');

                // Step 2 — spin the arc
                spinArc.style.animation = 'spin 0.7s linear infinite';

                setTimeout(() => {
                    // Step 3 — stop spin, draw full circle
                    spinArc.style.animation = 'none';
                    spinArc.style.opacity = '0';
                    fullCirc.style.animation = 'drawCircle 0.45s cubic-bezier(0.4,0,0.2,1) forwards';

                    setTimeout(() => {
                        // Step 4 — draw tick
                        tickPath.style.animation = 'drawTick 0.35s cubic-bezier(0.4,0,0.2,1) forwards';

                        setTimeout(() => {
                            // Step 5 — slide ring left, fade in "Completed"
                            ringEl.style.transition = 'transform 0.4s cubic-bezier(0.4,0,0.2,1)';
                            ringEl.style.transform = 'translateX(-38px)';
                            doneLabel.style.animation = 'fadeIn 0.35s 0.15s ease forwards';

                            // Step 6 — hold 2s then reset
                            setTimeout(() => {
                                animLayer.style.transition = 'opacity 0.35s';
                                animLayer.style.opacity = '0';

                                setTimeout(() => {
                                    // reset everything
                                    animLayer.classList.remove('go');
                                    animLayer.style.opacity = '';
                                    animLayer.style.transition = '';

                                    spinArc.style.animation = '';
                                    spinArc.style.opacity = '';

                                    fullCirc.style.animation = '';
                                    fullCirc.style.strokeDashoffset = '126';

                                    tickPath.style.animation = '';
                                    tickPath.style.strokeDashoffset = '28';

                                    ringEl.style.transition = '';
                                    ringEl.style.transform = '';

                                    doneLabel.style.animation = '';
                                    doneLabel.style.opacity = '0';

                                    btnText.style.display = 'flex';
                                    setTimeout(() => { btnText.style.opacity = '1'; }, 20);

                                    btn.disabled = false;
                                    busy = false;
                                }, 400);
                            }, 2000);
                        }, 400);
                    }, 480);
                }, 900);
            }, 200);
        }
    </script>

</body>

</html>
