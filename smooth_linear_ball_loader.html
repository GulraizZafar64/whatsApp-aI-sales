<style>
  .stage {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 36px;
    height: 140px;
    padding: 0 24px 16px;
    background: #000;
    border-radius: 16px;
    margin: 1rem 0;
  }
  .ball {
    width: 64px;
    height: 64px;
    background: #fff;
    border-radius: 50%;
    transform-origin: center bottom;
  }
  .b1 { animation: drop 2.1s cubic-bezier(0.4,0,0.2,1) 0s infinite; }
  .b2 { animation: drop 2.1s cubic-bezier(0.4,0,0.2,1) 0.7s infinite; }
  .b3 { animation: drop 2.1s cubic-bezier(0.4,0,0.2,1) 1.4s infinite; }

  @keyframes drop {
    0%   { transform: translateY(0)     scaleX(1)    scaleY(1);    }
    8%   { transform: translateY(0)     scaleX(1.4)  scaleY(0.5);  }
    18%  { transform: translateY(-90px) scaleX(0.88) scaleY(1.1);  }
    38%  { transform: translateY(-90px) scaleX(0.88) scaleY(1.1);  }
    52%  { transform: translateY(0)     scaleX(1.4)  scaleY(0.5);  }
    62%  { transform: translateY(-18px) scaleX(0.95) scaleY(1.04); }
    72%  { transform: translateY(0)     scaleX(1.1)  scaleY(0.92); }
    80%  { transform: translateY(-6px)  scaleX(1)    scaleY(1);    }
    88%  { transform: translateY(0)     scaleX(1)    scaleY(1);    }
    100% { transform: translateY(0)     scaleX(1)    scaleY(1);    }
  }
</style>

<h2 class="sr-only">Three white balls in a row, each smoothly bouncing up and squishing down one after another in a looping loading animation.</h2>

<div class="stage">
  <div class="ball b1"></div>
  <div class="ball b2"></div>
  <div class="ball b3"></div>
</div>
